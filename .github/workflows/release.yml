name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set version
        shell: pwsh
        run: |
          "VERSION=0.1.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Publish single exe
        shell: pwsh
        run: |
          dotnet publish app/JagexSwitcher.App/JagexSwitcher.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -o publish

      - name: Self-check
        shell: pwsh
        run: |
          publish/JagexSwitcher.exe --self-check

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag publish/JagexSwitcher.exe `
            --target $env:GITHUB_SHA `
            --title "Jagex Switcher $tag" `
            --notes "Self-contained Windows build. Jagex Switcher uses the SignPath Foundation program for Windows code signing. Adds single-instance guard, keyboard shortcuts (F5/F2/Del/Enter/Esc) and right-click menu, Last played + Status columns, hardened pair transfer (fixed-time code check, 5-attempt limit, 15-minute expiry, https-only URLs), atomic vault writes, and automatic capture cleanup after Add Account. Commit: $env:GITHUB_SHA"
