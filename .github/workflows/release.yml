name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set version
        shell: pwsh
        run: |
          "VERSION=0.1.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Publish single exe
        shell: pwsh
        run: |
          dotnet publish app/JagexSwitcher.App/JagexSwitcher.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -o publish

      - name: UI and service checks
        shell: pwsh
        run: dotnet run --project app/JagexSwitcher.VisualCheck -c Release -- .local/avalonia-check

      - name: Published self-check
        shell: pwsh
        run: |
          $check = Start-Process -FilePath (Resolve-Path publish/JagexSwitcher.exe) -ArgumentList '--self-check' -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Published self-check failed: $($check.ExitCode)" }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag publish/JagexSwitcher.exe `
            --target $env:GITHUB_SHA `
            --title "Jagex Switcher $tag" `
            --notes "Self-contained Windows x64 build with the new Avalonia character launcher, searchable profiles, guided account capture, optional PC-to-PC pairing, and light, dark, and high-contrast themes. UI and service checks run before release. Commit: $env:GITHUB_SHA"
